<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMINA · Expediente de Cumplimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#f1eee9;
    --paper-raised:#ffffff;
    --ink:#333333;
    --ink-soft:#737373;
    --line:#e9e9e9;
    --line-strong:#d2d2d2;
    --guinda:#ef7b70;
    --guinda-dark:#ba6057;
    --ok:#2f7a55;
    --ok-bg:#e4eee9;
    --bajo:#c9a227;
    --bajo-bg:#f8f3e3;
    --medio:#d98a2b;
    --medio-bg:#faf0e3;
    --urgente:#c2571f;
    --urgente-bg:#f7e9e2;
    --critico:#b23b35;
    --critico-bg:#f5e6e5;
    --vencido:#b23b35;
    --vencido-bg:#f5e6e5;
    --proceso:#d98a2b;
    --proceso-bg:#faf0e3;
    --pendiente:#737373;
    --pendiente-bg:#eeeeec;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans',sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .shell{display:flex;align-items:flex-start;min-height:100vh;}
  .sidebar{
    width:220px;flex-shrink:0;min-height:100vh;
    background:var(--paper-raised);border-right:1px solid var(--line);
    padding:26px 18px;position:sticky;top:0;
    display:flex;flex-direction:column;
  }
  .sidebar-brand{margin-bottom:24px;padding:0 6px;}
  .sidebar-logo{width:44px;height:44px;border-radius:10px;display:block;margin-bottom:8px;}
  .sidebar-eyebrow{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;color:var(--guinda);letter-spacing:.02em;}
  .sidebar-sub{font-family:'Public Sans',sans-serif;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
  .sidebar-nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:block;width:100%;text-align:left;background:transparent;border:none;
    padding:10px 12px;border-radius:var(--radius);
    font-family:'Public Sans',sans-serif;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;
  }
  .nav-item:hover{background:var(--paper);color:var(--ink);border-color:transparent;}
  .nav-item.active{background:var(--guinda);color:#fff;}
  .wrap{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
  @media (max-width:900px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;min-height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding:16px 18px;}
    .sidebar-nav{flex-direction:row;flex-wrap:wrap;}
  }


  /* ===== MASTHEAD ===== */
  .masthead{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-top:5px solid var(--guinda);
    border-radius:var(--radius);
    padding:26px 30px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .masthead-left{flex:1;min-width:260px;}
  .eyebrow{
    font-family:'Public Sans',sans-serif;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--guinda);
    font-weight:600;
    margin-bottom:6px;
  }
  h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;
    font-size:29px;
    margin:0 0 6px;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .company-input{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink-soft);
    border:none;
    background:transparent;
    border-bottom:1px dashed var(--line-strong);
    padding:2px 0;
    width:340px;
    max-width:100%;
  }
  .company-input:focus{outline:none;border-bottom-color:var(--guinda);}
  .meta-row{
    font-family:'Public Sans',sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:10px;
  }

  /* seal */
  .seal{
    width:112px;height:112px;border-radius:50%;
    border:2px solid currentColor;
    position:relative;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    flex-shrink:0;
  }
  .seal::before{
    content:'';
    position:absolute;inset:6px;
    border:1px dashed currentColor;
    border-radius:50%;
    opacity:.5;
  }
  .seal .pct{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:26px;line-height:1;}
  .seal .lbl{font-family:'Public Sans',sans-serif;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
  .seal.st-green{color:var(--ok);}
  .seal.st-amber{color:var(--proceso);}
  .seal.st-red{color:var(--vencido);}

  /* summary strip */
  .summary{
    display:flex;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .summary .cell{
    flex:1;min-width:130px;
    background:var(--paper-raised);
    padding:14px 18px;
    cursor:pointer;
    transition:background .12s;
  }
  .summary .cell:hover{background:#fff;}
  .summary .cell.active{background:#fff;box-shadow:inset 0 -3px 0 var(--guinda);}
  .summary .num{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:24px;}
  .summary .lbl{font-family:'Public Sans',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .dot.ok{background:var(--ok);} .dot.bajo{background:var(--bajo);}
  .dot.medio{background:var(--medio);} .dot.urgente{background:var(--urgente);} .dot.critico{background:var(--critico);}

  /* toolbar */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .toolbar-right{display:flex;gap:8px;}
  button{
    font-family:'Public Sans',sans-serif;
    font-size:12.5px;font-weight:600;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    color:var(--ink);
    padding:8px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:all .12s;
  }
  button:hover{border-color:var(--guinda);color:var(--guinda);}
  button.primary{background:var(--guinda);color:#fff;border-color:var(--guinda);}
  button.primary:hover{background:var(--guinda-dark);color:#fff;}
  button.ghost{border-color:transparent;background:transparent;}
  button.small{padding:4px 9px;font-size:11px;}

  /* entity folder */
  .folder{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:16px;
  }
  .folder-tab{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 18px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    gap:12px;
    flex-wrap:wrap;
  }
  .folder-tab-left{display:flex;align-items:center;gap:12px;}
  .folder-name{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:17px;}
  .folder-sub{font-family:'Public Sans',sans-serif;font-size:10.5px;color:var(--ink-soft);}
  .stamp{
    width:42px;height:42px;border-radius:50%;
    border:2px solid currentColor;
    display:flex;align-items:center;justify-content:center;
    font-family:'Public Sans',sans-serif;font-weight:700;font-size:10.5px;
    flex-shrink:0;
  }
  .stamp.st-green{color:var(--ok);} .stamp.st-amber{color:var(--proceso);}
  .stamp.st-red{color:var(--vencido);} .stamp.st-gray{color:var(--pendiente);}
  .caret{transition:transform .15s;color:var(--ink-soft);}
  .caret.open{transform:rotate(90deg);}

  .folder-body{padding:4px 18px 16px;}
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;font-family:'Public Sans',sans-serif;
    font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;
    padding:8px 8px;border-bottom:1px solid var(--line);
  }
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.filtered-out{display:none;}
  .field{
    border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--ink);
    width:100%;padding:2px 0;
  }
  .field:focus{outline:none;background:#fff;}
  textarea.field{resize:vertical;min-height:32px;font-size:12.5px;}
  input.field-date{font-family:'Public Sans',sans-serif;font-size:12px;}

  .pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;border-radius:20px;
    font-family:'Public Sans',sans-serif;font-size:11px;font-weight:600;
    cursor:pointer;border:1px solid transparent;white-space:nowrap;
  }
  .pill.ok{background:var(--ok-bg);color:var(--ok);}
  .pill.bajo{background:var(--bajo-bg);color:var(--bajo);}
  .pill.medio{background:var(--medio-bg);color:var(--medio);}
  .pill.urgente{background:var(--urgente-bg);color:var(--urgente);}
  .pill.critico{background:var(--critico-bg);color:var(--critico);}

  .row-actions{white-space:nowrap;}
  .icon-btn{
    border:none;background:transparent;color:var(--ink-soft);
    cursor:pointer;font-size:15px;padding:2px 5px;
  }
  .icon-btn:hover{color:var(--vencido);}

  .add-row-btn{margin-top:10px;}

  .empty-note{
    padding:14px 8px;color:var(--ink-soft);font-style:italic;font-size:12.5px;
  }

  footer{
    text-align:center;color:var(--ink-soft);font-size:11px;
    font-family:'Public Sans',sans-serif;margin-top:30px;
  }

  .loading{padding:60px 0;text-align:center;color:var(--ink-soft);font-family:'Public Sans',sans-serif;font-size:12px;}

  @media (max-width:640px){
    .masthead{flex-direction:column;}
    thead{display:none;}
    tbody td{display:block;border-bottom:none;padding:4px 8px;}
    tbody tr{border-bottom:1px solid var(--line);padding-bottom:8px;display:block;}
    tbody td::before{
      content:attr(data-label);
      font-family:'Public Sans',sans-serif;font-size:9.5px;color:var(--ink-soft);
      text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px;
    }
  }
  .hidden{display:none !important;}

  /* ===== LOGIN ===== */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;max-width:360px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-top:5px solid var(--guinda);
    border-radius:var(--radius);
    padding:32px 30px;
  }
  .login-card h1{font-size:22px;margin-bottom:4px;}
  .login-sub{font-family:'Public Sans',sans-serif;font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
  .login-field{margin-bottom:14px;}
  .login-field label{
    display:block;font-family:'Public Sans',sans-serif;font-size:11px;font-weight:600;
    color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;
  }
  .login-field input{
    width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--radius);
    font-family:'Public Sans',sans-serif;font-size:14px;color:var(--ink);background:#fff;
  }
  .login-field input:focus{outline:none;border-color:var(--guinda);}
  .login-error{color:var(--vencido);font-size:12px;font-family:'Public Sans',sans-serif;margin-bottom:12px;min-height:16px;}
  .login-card button.primary{width:100%;padding:10px;font-size:13px;margin-top:4px;}
  .login-toggle{
    margin-top:16px;text-align:center;font-family:'Public Sans',sans-serif;font-size:12px;color:var(--ink-soft);
  }
  .sidebar-user{
    margin-top:auto;padding-top:16px;border-top:1px solid var(--line);
    font-family:'Public Sans',sans-serif;font-size:11.5px;color:var(--ink-soft);
  }
  .sidebar-user a{color:var(--guinda);cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap hidden">
  <div class="login-card">
    <div class="eyebrow">Dirección de Compliance</div>
    <h1>Expediente de Cumplimiento</h1>
    <div class="login-sub">Inicia sesión con la cuenta que te dio el administrador del equipo.</div>
    <div class="login-error" id="loginError"></div>
    <div class="login-field">
      <label for="loginEmail">Correo</label>
      <input type="email" id="loginEmail" autocomplete="username" placeholder="tunombre@empresa.com">

    <div class="login-field">

</div>

<div id="saveErrorBanner" class="hidden" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#b23b35;color:#fff;padding:10px 18px;border-radius:8px;font-family:'Public Sans',sans-serif;font-size:13px;z-index:999;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw;"></div>

<script>
let ENTITY_DEFS = [
  {id:'sat', name:'SAT', sub:'Servicio de Administración Tributaria', category:'fiscal'},

let locationFormError = '';


// Días esperados entre verificaciones, según periodicidad declarada.
// Se usa para avisar cuándo una obligación "verificable" (opiniones de
// cumplimiento, vigencias, etc.) ya debería revisarse de nuevo.
const RECHECK_DAYS = {
  'mensual':30, 'bimestral':60, 'trimestral':90, 'anual':365,
  'permanente':30, 'cada 3 años':1095
};
function recheckDaysFor(periodicity){
  const key = (periodicity||'').trim().toLowerCase();
  return RECHECK_DAYS[key] ?? 30;
}

function seedObligations(){
  const mk = (entity, title, periodicity, responsible, status, offsetDays, notes, lastCheckedOffset) => ({
    id: crypto.randomUUID(),
    entity, title, periodicity, responsible, status, notes: notes||'',
    dueDate: offsetDate(offsetDays),
    lastChecked: lastCheckedOffset!==undefined ? offsetDate(lastCheckedOffset) : null
  });
  function offsetDate(days){
    const d = new Date();
    d.setDate(d.getDate()+days);
    return d.toISOString().slice(0,10);
  }
  return [
    mk('sat','Declaración mensual ISR/IVA','Mensual','','ok',9,''),
    mk('sat','DIOT','Mensual','','ok',9,''),
    mk('sat','Declaración anual','Anual','','bajo',180,''),
    mk('sat','Opinión de cumplimiento (32-D)','Mensual','','bajo',24,'Sube aquí el PDF de la opinión de cumplimiento cuando la descargues del SAT.',null),

    mk('imss','Pago de cuotas obrero-patronales (SUA)','Mensual','','ok',12,''),
    mk('imss','Opinión de cumplimiento IMSS','Mensual','','medio',5,''),
    mk('imss','Dictamen IMSS (si aplica)','Anual','','bajo',200,'Confirmar si la empresa está obligada'),
    mk('infonavit','Aportaciones patronales 5% (bimestral vía SUA)','Bimestral','','ok',20,''),
    mk('infonavit','Amortizaciones de crédito de trabajadores','Bimestral','','ok',20,''),
    mk('infonavit','Opinión de cumplimiento Infonavit (ICSOEP)','Mensual','','medio',5,''),
    mk('repse','Vigencia del registro REPSE','Cada 3 años','','ok',380,''),
    mk('repse','Reporte trimestral ante STPS (REPSE)','Trimestral','','critico',-4,'Pendiente de subir evidencia del trimestre'),
    mk('tesoreria','Impuesto sobre nómina (ISN)','Mensual','','ok',15,''),
    mk('tesoreria','Licencia de funcionamiento','Anual','','bajo',150,''),
    mk('otros','Constancia de situación fiscal de proveedores','Permanente','','bajo',60,''),

}

// =====================================================================
// CONFIGURACIÓN DE SUPABASE — reemplaza estos dos valores con los de
// tu proyecto (Supabase → Project Settings → API). El anon key es
// público por diseño (protegido por Row Level Security), pero SIEMPRE
// usa el "anon public key", nunca el "service_role key".
// =====================================================================
const SUPABASE_URL = 'https://mvzybyslnhkcixltddsm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12enlieXNsbmhrY2l4bHRkZHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NTM2NTcsImV4cCI6MjEwMDIyOTY1N30.p-O_6hqF6N320kPIPznu07yaz8dCLKAgaVms9lMetFI';

// Muestra cualquier error en pantalla (en vez de una página en blanco)
// para poder diagnosticar sin depender de la consola del navegador.
function showFatalError(msg){
  const el = document.getElementById('app');
  el.classList.remove('hidden');
  el.innerHTML = `<div style="max-width:560px;margin:60px auto;padding:24px;border:1px solid #e0b0ac;background:#fdf2f1;border-radius:8px;font-family:sans-serif;color:#333;">
    <strong style="color:#b23b35;">No se pudo cargar el dashboard</strong>
    <p style="font-size:13px;margin-top:10px;">${msg}</p>
  </div>`;
}
window.addEventListener('error', (e) => showFatalError('Error de JavaScript: ' + e.message));
window.addEventListener('unhandledrejection', (e) => showFatalError('Error de conexión: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

let supabaseClient;
try{
  if(!window.supabase) throw new Error('La librería de Supabase no cargó (revisa tu conexión o si algo bloquea cdn.jsdelivr.net).');
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  showFatalError(e.message);
}

const STATUS_ORDER = ['critico','urgente','medio','bajo','ok'];
const STATUS_LABEL = {critico:'Crítico', urgente:'Urgente', medio:'Medio', bajo:'Bajo', ok:'Al corriente'};

let obligations = [];
let companyName = 'MEXSTAYS LUMINA S.A.P.I. de C.V.';
let activeFilter = null;
let openFolders = new Set();
let currentView = 'fiscal'; // 'fiscal' | 'operativo' | 'entities' | 'settings' | 'reports' | 'history' | 'semaforo'
let entityFormError = '';
let newBuildingFormState = '';

// ---- Historial de documentos ----
let allDocuments = [];
let historyOpenEntities = new Set();
let historyFilters = { entity: '', month: '', year: '', search: '' };

// ---- Mapeo camelCase (JS) <-> snake_case (Postgres) ----
function fromDb(row){
  return {
    id: row.id, entity: row.entity, title: row.title, periodicity: row.periodicity,
    responsible: row.responsible, status: row.status, notes: row.notes,
    dueDate: row.due_date, lastChecked: row.last_checked,
    documentUrl: row.document_url, documentName: row.document_name,
    state: row.state, city: row.city, building: row.building
  };
}
function toDb(o){
  return {
    id: o.id, entity: o.entity, title: o.title, periodicity: o.periodicity,
    responsible: o.responsible, status: o.status, notes: o.notes,
    due_date: o.dueDate || null, last_checked: o.lastChecked || null,
    document_url: o.documentUrl || null, document_name: o.documentName || null,
    state: o.state || null, city: o.city || null, building: o.building || null,
    updated_at: new Date().toISOString()
  };
}

// ---- Autenticación ----
let currentUserEmail = '';
let currentUserRole = 'responsable';
let isAdmin = false;

async function handleLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  if(!email || !pass){ errBox.textContent = 'Ingresa correo y contraseña.'; return; }
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
  if(error){ errBox.textContent = 'No se pudo iniciar sesión: ' + error.message; return; }
  currentUserEmail = data.user.email;
  showApp();
}

async function handleLogout(){
  await supabaseClient.auth.signOut();
  location.reload();
}

function showLogin(){
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}

async function loadCurrentRole(){
  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user){ currentUserRole = 'responsable'; isAdmin = false; return; }
  const { data: profile } = await supabaseClient.from('profiles').select('role,email').eq('id', user.id).maybeSingle();
  currentUserRole = profile?.role || 'responsable';
  isAdmin = currentUserRole === 'admin';
}

async function showApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  try{
    await loadCurrentRole();
    await loadData();
    subscribeRealtime();
  }catch(e){
    showFatalError(e.message);
  }
}

async function initAuth(){
  try{
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session){
      currentUserEmail = session.user.email;
      showApp();
    } else {
      showLogin();
    }
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if(event === 'SIGNED_OUT'){ showLogin(); }
    });
  }catch(e){
    showFatalError(e.message);
  }
}

// ---- Carga / guardado contra Supabase ----
async function loadData(){
  const { data, error } = await supabaseClient.from('obligations').select('*').order('created_at', { ascending: true });
  if(error){ console.error(error); obligations = []; }
  else if(data.length === 0){
    // Primera vez: sembramos datos de ejemplo para todo el equipo.
    obligations = seedObligations();
    await supabaseClient.from('obligations').insert(obligations.map(toDb));
  } else {
    obligations = data.map(fromDb);
  }

  const { data: settingsRow } = await supabaseClient.from('settings').select('*').eq('key','companyName').maybeSingle();
  if(settingsRow) companyName = settingsRow.value;
  else await supabaseClient.from('settings').insert({ key:'companyName', value: companyName });

  const { data: entitiesRow } = await supabaseClient.from('settings').select('*').eq('key','entities').maybeSingle();
  if(entitiesRow){
    try{
      ENTITY_DEFS = JSON.parse(entitiesRow.value);
      ENTITY_DEFS.forEach(e=>{ if(!e.category) e.category = 'fiscal'; });
    }catch(e){ /* se queda con el default */ }
  } else {
    await supabaseClient.from('settings').insert({ key:'entities', value: JSON.stringify(ENTITY_DEFS) });
  }
  openFolders = new Set(ENTITY_DEFS.map(e=>e.id));
  if(historyOpenEntities.size === 0) historyOpenEntities = new Set(ENTITY_DEFS.map(e=>e.id));

  const { data: stateCityRow } = await supabaseClient.from('settings').select('*').eq('key','stateCityMap').maybeSingle();
  if(stateCityRow){
    try{ STATE_CITY_MAP = JSON.parse(stateCityRow.value); }catch(e){ /* se queda con el default */ }
  } else {
    await supabaseClient.from('settings').insert({ key:'stateCityMap', value: JSON.stringify(STATE_CITY_MAP) });
  }

  const { data: buildingRow } = await supabaseClient.from('settings').select('*').eq('key','buildingMap').maybeSingle();
  if(buildingRow){
    try{ BUILDING_MAP = JSON.parse(buildingRow.value); }catch(e){ /* se queda con el default */ }
  } else {
    await supabaseClient.from('settings').insert({ key:'buildingMap', value: JSON.stringify(BUILDING_MAP) });
  }

  const { data: docsData, error: docsError } = await supabaseClient.from('documents').select('*').order('uploaded_at', { ascending: false });
  if(docsError){ console.error(docsError); allDocuments = []; }
  else { allDocuments = docsData; }

  render();
}

function showSaveError(msg){
  const el = document.getElementById('saveErrorBanner');
  if(!el) return;
  el.textContent = '⚠ No se guardó tu cambio: ' + msg;
  el.classList.remove('hidden');
  clearTimeout(window._saveErrTimeout);
  window._saveErrTimeout = setTimeout(()=>{ el.classList.add('hidden'); }, 8000);
}

async function persistObligation(o){
  const { error } = await supabaseClient.from('obligations').upsert(toDb(o));
  if(error){
    console.error('No se pudo guardar', error);
    showSaveError(error.message);
  }
}

let docUploadError = '';

async function uploadDocument(id, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  docUploadError = '';
  if(file.type !== 'application/pdf'){
    docUploadError = 'Solo se aceptan archivos PDF.';
    render();
    return;
  }
  if(file.size > 15*1024*1024){
    docUploadError = 'El PDF pesa más de 15 MB, sube un archivo más ligero.';
    render();
    return;
  }
  const o = obligations.find(x=>x.id===id);
  if(!o) return;
  const path = `${id}/${Date.now()}-${file.name}`;
  const { error: upErr } = await supabaseClient.storage.from('compliance-docs').upload(path, file, { upsert:true });
  if(upErr){ docUploadError = 'No se pudo subir el PDF: ' + upErr.message; render(); return; }
  // Guardamos solo la ruta interna (no una URL pública): el bucket es privado
  // y las ligas para verlo se generan al vuelo, con vigencia corta.
  o.documentUrl = path;
  o.documentName = file.name;
  await persistObligation(o);

  const { data: docRow, error: docErr } = await supabaseClient.from('documents').insert({
    entity: o.entity,
    obligation_id: o.id,
    obligation_title: o.title,
    document_url: path,
    document_name: file.name
  }).select().single();
  if(!docErr && docRow) allDocuments.unshift(docRow);

  render();
}

async function viewDocument(path){
  const { data, error } = await supabaseClient.storage.from('compliance-docs').createSignedUrl(path, 3600);
  if(error){ showSaveError('No se pudo abrir el documento: ' + error.message); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}

async function removeDocument(id){
  const o = obligations.find(x=>x.id===id);
  if(!o) return;
  o.documentUrl = null;
  o.documentName = null;
  await persistObligation(o);
  render();
}

async function deleteHistoryDocument(docId){
  const { error } = await supabaseClient.from('documents').delete().eq('id', docId);
  if(error){ showSaveError(error.message); return; }
  allDocuments = allDocuments.filter(d=>d.id!==docId);
  render();
}

}

function setHistoryFilter(field, value){

async function saveLocations(){
  const { error: e1 } = await supabaseClient.from('settings').upsert({ key:'stateCityMap', value: JSON.stringify(STATE_CITY_MAP) });
  const { error: e2 } = await supabaseClient.from('settings').upsert({ key:'buildingMap', value: JSON.stringify(BUILDING_MAP) });

function addState(){
  const input = document.getElementById('newStateName');
  const name = input.value.trim();
  locationFormError = '';
  if(!name){ locationFormError = 'Ponle un nombre al estado.'; render(); return; }
  if(STATE_CITY_MAP[name]){ locationFormError = 'Ese estado ya existe.'; render(); return; }
  STATE_CITY_MAP[name] = [];
  BUILDING_MAP[name] = {};
  saveLocations();
  render();
}

function deleteState(state){
  delete STATE_CITY_MAP[state];
  delete BUILDING_MAP[state];
  saveLocations();
  render();
}

function addCity(){
  const stateSel = document.getElementById('newCityState');
  const nameInput = document.getElementById('newCityName');
  const state = stateSel.value;
  const name = nameInput.value.trim();
  locationFormError = '';
  if(!state){ locationFormError = 'Elige un estado.'; render(); return; }
  if(!name){ locationFormError = 'Ponle un nombre a la ciudad.'; render(); return; }
  if(!STATE_CITY_MAP[state]) STATE_CITY_MAP[state] = [];
  if(STATE_CITY_MAP[state].includes(name)){ locationFormError = 'Esa ciudad ya existe en ese estado.'; render(); return; }
  STATE_CITY_MAP[state].push(name);
  if(!BUILDING_MAP[state]) BUILDING_MAP[state] = {};
  if(!BUILDING_MAP[state][name]) BUILDING_MAP[state][name] = [];
  saveLocations();
  render();
}

function deleteCity(state, city){
  STATE_CITY_MAP[state] = (STATE_CITY_MAP[state]||[]).filter(c=>c!==city);
  if(BUILDING_MAP[state]) delete BUILDING_MAP[state][city];
  saveLocations();
  render();
}

function addBuilding(){
  const stateSel = document.getElementById('newBuildingState');
  const citySel = document.getElementById('newBuildingCity');
  const nameInput = document.getElementById('newBuildingName');
  const state = stateSel.value;
  const city = citySel.value;
  const name = nameInput.value.trim();
  locationFormError = '';
  if(!state || !city){ locationFormError = 'Elige estado y ciudad.'; render(); return; }
  if(!name){ locationFormError = 'Ponle un nombre al edificio/proyecto.'; render(); return; }
  if(!BUILDING_MAP[state]) BUILDING_MAP[state] = {};
  if(!BUILDING_MAP[state][city]) BUILDING_MAP[state][city] = [];
  if(BUILDING_MAP[state][city].includes(name)){ locationFormError = 'Ese edificio ya existe en esa ciudad.'; render(); return; }
  BUILDING_MAP[state][city].push(name);
  saveLocations();
  render();
}

function deleteBuilding(state, city, building){
  if(BUILDING_MAP[state] && BUILDING_MAP[state][city]){
    BUILDING_MAP[state][city] = BUILDING_MAP[state][city].filter(b=>b!==building);
  }
  saveLocations();
  render();
}

function slugify(name){
  const base = (name||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // quita acentos
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  let slug = base || 'dependencia';
  let n = 1;
  while(ENTITY_DEFS.some(e=>e.id===slug)){ slug = base + '-' + (++n); }
  return slug;
}

function addEntity(){
  const nameInput = document.getElementById('newEntityName');
  const subInput = document.getElementById('newEntitySub');
  const categoryInput = document.getElementById('newEntityCategory');
  const name = nameInput.value.trim();
  entityFormError = '';
  if(!name){ entityFormError = 'Ponle un nombre a la dependencia.'; render(); return; }
  ENTITY_DEFS.push({ id: slugify(name), name, sub: subInput.value.trim(), category: categoryInput.value || 'fiscal' });
  openFolders.add(ENTITY_DEFS[ENTITY_DEFS.length-1].id);
  saveEntities();
  render();
}

function updateEntityField(id, field, value){
  const ent = ENTITY_DEFS.find(e=>e.id===id);
  if(!ent) return;
  ent[field] = value;
  saveEntities();
}

function deleteEntity(id){
  const count = obligations.filter(o=>o.entity===id).length;
  if(count > 0){
    entityFormError = `No se puede eliminar: tiene ${count} obligación(es) registrada(s). Elimínalas o muévelas primero.`;
    render();
    return;
  }
  ENTITY_DEFS = ENTITY_DEFS.filter(e=>e.id!==id);
  saveEntities();
  render();
}

function setView(view){

}

// ---- Tiempo real: si otro miembro del equipo edita, se refleja aquí ----
let realtimeChannel = null;
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = supabaseClient.channel('obligations-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'obligations' }, () => { loadData(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, () => { loadData(); })
    .subscribe();
}

function statusScore(status){
  return {ok:1, bajo:0.75, medio:0.5, urgente:0.25, critico:0}[status] ?? 0;
}

function overallHealth(){
  if(obligations.length===0) return {pct:100, cls:'st-green'};
  const sum = obligations.reduce((a,o)=>a+statusScore(o.status),0);
  const pct = Math.round((sum/obligations.length)*100);
  let cls = 'st-green';
  if(pct<70) cls='st-red'; else if(pct<90) cls='st-amber';
  return {pct, cls};
}

function entityHealth(entityId){
  const list = obligations.filter(o=>o.entity===entityId);
  if(list.length===0) return {pct:null, cls:'st-gray'};
  const sum = list.reduce((a,o)=>a+statusScore(o.status),0);
  const pct = Math.round((sum/list.length)*100);
  let cls = 'st-green';
  if(pct<70) cls='st-red'; else if(pct<90) cls='st-amber';
  return {pct, cls};
}

function categoryHealth(category){
  const entityIds = new Set(ENTITY_DEFS.filter(e=>e.category===category).map(e=>e.id));
  const list = obligations.filter(o=>entityIds.has(o.entity));
  if(list.length===0) return {pct:null, cls:'st-gray'};
  const sum = list.reduce((a,o)=>a+statusScore(o.status),0);
  const pct = Math.round((sum/list.length)*100);
  let cls = 'st-green';
  if(pct<70) cls='st-red'; else if(pct<90) cls='st-amber';
  return {pct, cls, count:list.length};
}

function counts(){
  const c = {critico:0, urgente:0, medio:0, bajo:0, ok:0};
  obligations.forEach(o=>{ if(c[o.status]!==undefined) c[o.status]++; });
  return c;
}

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}

function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}

function updateField(id, field, value){
  const o = obligations.find(x=>x.id===id);
  if(!o) return;
  o[field] = value;
  persistObligation(o);
}

function cycleStatus(id){
  const o = obligations.find(x=>x.id===id);
  if(!o) return;
  const idx = STATUS_ORDER.indexOf(o.status);
  o.status = STATUS_ORDER[(idx+1)%STATUS_ORDER.length];
  persistObligation(o);
  render();
}

async function deleteObligation(id){
  obligations = obligations.filter(o=>o.id!==id);
  const { error } = await supabaseClient.from('obligations').delete().eq('id', id);
  if(error) console.error('No se pudo eliminar', error);
  render();
}

function exportCSV(){
  const rows = [['Categoría','Dependencia','Concepto','Estado','Ciudad','Edificio/Proyecto','Periodicidad','Próxima fecha','Última verificación','Responsable','Estatus','Evidencia (PDF)','Notas']];
  obligations.forEach(o=>{
    const ent = ENTITY_DEFS.find(e=>e.id===o.entity);
    const entName = ent?.name || o.entity;
    const catLabel = CATEGORY_LABEL[ent?.category] || '';
    rows.push([catLabel,entName,o.title,o.state||'',o.city||'',o.building||'',o.periodicity,o.dueDate,o.lastChecked||'',o.responsible,STATUS_LABEL[o.status],o.documentUrl?'Sí (ver en el dashboard)':'',o.notes]);
  });
  const csv = rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'cumplimiento_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderEntityFolder(ent, showLocation){
  const list = obligations.filter(o=>o.entity===ent.id);
  const open = openFolders.has(ent.id);
  const eh = entityHealth(ent.id);
  const stampLabel = eh.pct===null ? '—' : eh.pct+'%';
  let html = `<div class="folder">
    <div class="folder-tab" onclick="toggleFolder('${ent.id}')">
      <div class="folder-tab-left">
        <span class="caret ${open?'open':''}">▸</span>
        <div class="stamp ${eh.cls}">${stampLabel}</div>
        <div>
          <div class="folder-name">${escapeHtml(ent.name)}</div>
          <div class="folder-sub">${escapeHtml(ent.sub)} · ${list.length} obligación${list.length===1?'':'es'}</div>
        </div>
      </div>
    </div>`;
  if(open){
    html += `<div class="folder-body">`;
    if(docUploadError){
      html += `<div style="background:var(--vencido-bg);color:var(--vencido);padding:8px 12px;border-radius:var(--radius);font-size:12px;margin-bottom:12px;">${escapeHtml(docUploadError)}</div>`;
    }
    const visible = list.filter(o=>!activeFilter || o.status===activeFilter);
    if(list.length===0){
      html += `<div class="empty-note">Sin obligaciones registradas todavía.</div>`;
    } else if(visible.length===0){
      html += `<div class="empty-note">Ninguna obligación de esta dependencia coincide con el filtro activo.</div>`;
    } else {
      html += `<table><thead><tr>
        <th style="width:${showLocation?'16':'28'}%">Concepto</th>
        ${showLocation ? `<th style="width:7%">Estado</th><th style="width:7%">Ciudad</th><th style="width:12%">Edificio/Proyecto</th>` : ''}
        <th style="width:6%">Periodicidad</th>
        <th style="width:${showLocation?'6':'7'}%">Próxima fecha</th>
        <th style="width:${showLocation?'7':'8'}%">Última verificación</th>
        <th style="width:${showLocation?'10':'13'}%">Responsable</th>
        <th style="width:${showLocation?'7':'8'}%">Estatus</th>
        <th style="width:${showLocation?'8':'9'}%">Evidencia (PDF)</th>
        <th style="width:${showLocation?'11':'17'}%">Notas</th>
        <th style="width:4%"></th>
      </tr></thead><tbody>`;
      visible.forEach(o=>{
        const du = daysUntil(o.dueDate);
        let dueHint = '';
        if(du!==null){
          if(du<0) dueHint = `<div style="font-size:10px;color:var(--vencido);font-family:'Public Sans',sans-serif;">${Math.abs(du)}d vencido</div>`;
          else if(du<=14) dueHint = `<div style="font-size:10px;color:var(--proceso);font-family:'Public Sans',sans-serif;">en ${du}d</div>`;
        }
        const recheckLimit = recheckDaysFor(o.periodicity);
        let checkHint = '';
        if(!o.lastChecked){
          checkHint = `<div style="font-size:10px;color:var(--pendiente);font-family:'Public Sans',sans-serif;">sin verificar</div>`;
        } else {
          const sinceChecked = daysUntil(o.lastChecked) * -1;
          if(sinceChecked > recheckLimit){
            checkHint = `<div style="font-size:10px;color:var(--vencido);font-family:'Public Sans',sans-serif;">revisar de nuevo</div>`;
          } else {
            checkHint = `<div style="font-size:10px;color:var(--ok);font-family:'Public Sans',sans-serif;">vigente (${sinceChecked}d)</div>`;
          }
        }
        const canUploadHere = isAdmin || (o.responsible && o.responsible === currentUserEmail && !o.documentUrl);
        const canRemoveHere = isAdmin;
        const fieldsEditable = isAdmin;
        html += `<tr>
          <td data-label="Concepto">${fieldsEditable ? `<input class="field" value="${escapeAttr(o.title)}" onchange="updateField('${o.id}','title',this.value)">` : escapeHtml(o.title)}</td>
          ${showLocation ? `
          <td data-label="Estado">${fieldsEditable ? `<select style="border:1px solid var(--line-strong);border-radius:var(--radius);padding:5px 6px;font-family:'Public Sans',sans-serif;font-size:12.5px;width:100%;" onchange="updateField('${o.id}','state',this.value); render();">
              <option value="">—</option>
              ${Object.keys(STATE_CITY_MAP).map(s=>`<option value="${escapeAttr(s)}" ${o.state===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
            </select>` : (escapeHtml(o.state)||'—')}</td>
          <td data-label="Ciudad">${fieldsEditable ? `<select style="border:1px solid var(--line-strong);border-radius:var(--radius);padding:5px 6px;font-family:'Public Sans',sans-serif;font-size:12.5px;width:100%;" onchange="updateField('${o.id}','city',this.value); render();">
              <option value="">—</option>
              ${(STATE_CITY_MAP[o.state]||[]).map(c=>`<option value="${escapeAttr(c)}" ${o.city===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
            </select>` : (escapeHtml(o.city)||'—')}</td>
          <td data-label="Edificio/Proyecto">${fieldsEditable ? `<select style="border:1px solid var(--line-strong);border-radius:var(--radius);padding:5px 6px;font-family:'Public Sans',sans-serif;font-size:12.5px;width:100%;" onchange="updateField('${o.id}','building',this.value)">
              <option value="">—</option>
              ${((BUILDING_MAP[o.state]||{})[o.city]||[]).map(b=>`<option value="${escapeAttr(b)}" ${o.building===b?'selected':''}>${escapeHtml(b)}</option>`).join('')}
            </select>` : (escapeHtml(o.building)||'—')}</td>
          ` : ''}
          <td data-label="Periodicidad">${fieldsEditable ? `<input class="field" value="${escapeAttr(o.periodicity)}" onchange="updateField('${o.id}','periodicity',this.value)">` : escapeHtml(o.periodicity)}</td>
          <td data-label="Próxima fecha">
            ${fieldsEditable ? `<input type="date" class="field field-date" value="${o.dueDate||''}" onchange="updateField('${o.id}','dueDate',this.value); render();">` : `<span class="field-date">${fmtDate(o.dueDate)}</span>`}
            ${dueHint}
          </td>
          <td data-label="Última verificación">
            ${fieldsEditable ? `<input type="date" class="field field-date" value="${o.lastChecked||''}" onchange="updateField('${o.id}','lastChecked',this.value); render();">` : `<span class="field-date">${fmtDate(o.lastChecked)}</span>`}
            ${checkHint}
          </td>
          <td data-label="Responsable">${fieldsEditable ? `<input class="field" placeholder="correo@empresa.com" value="${escapeAttr(o.responsible)}" onchange="updateField('${o.id}','responsible',this.value)">` : (escapeHtml(o.responsible)||'—')}</td>
          <td data-label="Estatus">${isAdmin ? `<span class="pill ${o.status}" onclick="cycleStatus('${o.id}')">${STATUS_LABEL[o.status]}</span>` : `<span class="pill ${o.status}" style="cursor:default;">${STATUS_LABEL[o.status]}</span>`}</td>
          <td data-label="Evidencia (PDF)">
            ${o.documentUrl
              ? `<div style="display:flex;flex-direction:column;gap:4px;">
                   <a href="#" onclick="viewDocument('${escapeAttr(o.documentUrl)}'); return false;" style="font-size:12px;color:var(--guinda);text-decoration:underline;word-break:break-all;cursor:pointer;">📄 ${escapeHtml(o.documentName||'Ver PDF')}</a>
                   ${canRemoveHere ? `<a href="#" onclick="removeDocument('${o.id}'); return false;" style="font-size:11px;color:var(--ink-soft);">Quitar</a>` : ''}
                 </div>`
              : (canUploadHere
                  ? `<input type="file" accept="application/pdf" style="font-size:11px;max-width:140px;" onchange="uploadDocument('${o.id}', this)">`
                  : `<span style="font-size:11px;color:var(--ink-soft);">—</span>`)
            }
          </td>
          <td data-label="Notas">${fieldsEditable ? `<textarea class="field" rows="1" onchange="updateField('${o.id}','notes',this.value)">${escapeHtml(o.notes)}</textarea>` : `<span style="font-size:12.5px;">${escapeHtml(o.notes)||'—'}</span>`}</td>
          <td class="row-actions">${isAdmin ? `<button class="icon-btn" title="Eliminar" onclick="deleteObligation('${o.id}')">✕</button>` : ''}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
    if(isAdmin) html += `<button class="small add-row-btn" onclick="addObligation('${ent.id}')">+ Agregar obligación</button>`;
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function countsForCategory(category){
  const entityIds = new Set(ENTITY_DEFS.filter(e=>e.category===category).map(e=>e.id));
  const c = {critico:0, urgente:0, medio:0, bajo:0, ok:0};
  obligations.forEach(o=>{ if(entityIds.has(o.entity) && c[o.status]!==undefined) c[o.status]++; });
  return c;
}

function renderCategoryView(category){
  const health = categoryHealth(category);
  const c = countsForCategory(category);
  const entitiesInSection = ENTITY_DEFS.filter(e=>e.category===category);
  const total = entitiesInSection.reduce((sum,e)=>sum + obligations.filter(o=>o.entity===e.id).length, 0);
  const label = CATEGORY_LABEL[category] || category;

  let html = '';

  // masthead
  html += `
  <div class="masthead">
    <div class="masthead-left">
      <div class="eyebrow">Dirección de Compliance · Tablero de control</div>
      <h1>${escapeHtml(label)}</h1>
      <input class="company-input" id="companyInput" value="${escapeAttr(companyName)}" placeholder="Nombre de la empresa">
      <div class="meta-row">Actualizado: ${new Date().toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})} · ${total} obligaciones bajo seguimiento</div>
    </div>
    <div class="seal ${health.cls}">
      <div class="pct">${health.pct===null?'—':health.pct+'%'}</div>
      <div class="lbl">cumplimiento</div>
    </div>
  </div>`;

  // summary strip
  const cells = [
    {key:null, label:'Total', num:total, dot:null},
    {key:'critico', label:'Crítico', num:c.critico, dot:'critico'},
    {key:'urgente', label:'Urgente', num:c.urgente, dot:'urgente'},
    {key:'medio', label:'Medio', num:c.medio, dot:'medio'},
    {key:'bajo', label:'Bajo', num:c.bajo, dot:'bajo'},
    {key:'ok', label:'Al corriente', num:c.ok, dot:'ok'},
  ];
  html += `<div class="summary">`;
  cells.forEach(cell=>{
    const active = activeFilter===cell.key ? 'active' : '';
    html += `<div class="cell ${active}" onclick="setFilter(${cell.key?`'${cell.key}'`:'null'})">
      <div class="num">${cell.dot?`<span class="dot ${cell.dot}"></span>`:''}${cell.num}</div>
      <div class="lbl">${cell.label}</div>
    </div>`;
  });
  html += `</div>`;

  // toolbar
  html += `<div class="toolbar">
    <div style="font-family:'Public Sans',sans-serif;font-size:11px;color:var(--ink-soft);">
      ${activeFilter ? 'Filtrando: '+STATUS_LABEL[activeFilter] : 'Mostrando todas las obligaciones'}
    </div>
    <div class="toolbar-right">
      <button onclick="exportCSV()">Exportar CSV</button>
    </div>
  </div>`;

  if(entitiesInSection.length===0){
    html += `<div class="empty-note">Sin dependencias en esta categoría todavía. ${isAdmin ? 'Agrega una desde "Dependencias".' : ''}</div>`;
  } else {
    entitiesInSection.forEach(ent=>{
      html += renderEntityFolder(ent, category==='operativo');
    });
  }

  html += `<footer>Datos guardados de forma privada en tu cuenta · Haz clic en un estatus para cambiarlo</footer>`;

  return html;
}

function renderSemaforoView(){
  const total = obligations.length;
  const LEVELS = [
    {key:'critico', label:'Crítico', var:'--critico', bg:'--critico-bg', desc:'Requiere atención inmediata'},
    {key:'urgente', label:'Urgente', var:'--urgente', bg:'--urgente-bg', desc:'Actuar en los próximos días'},
    {key:'medio', label:'Medio', var:'--medio', bg:'--medio-bg', desc:'En seguimiento activo'},
    {key:'bajo', label:'Bajo', var:'--bajo', bg:'--bajo-bg', desc:'Riesgo menor, vigilar'},
    {key:'ok', label:'Al corriente', var:'--ok', bg:'--ok-bg', desc:'Sin pendientes'},
  ];
  const c = counts();

  let html = `
  <div class="masthead" style="border-top-color:var(--guinda);">
    <div class="masthead-left">
      <div class="eyebrow">Vista rápida</div>

      <div class="meta-row">${total} obligaciones · haz clic en un color para filtrar la lista de abajo</div>
    </div>
  </div>`;

  // tarjetas grandes de semáforo
  html += `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">`;
  LEVELS.forEach(lvl=>{
    const active = activeFilter===lvl.key ? 'box-shadow:0 0 0 2px var('+lvl.var+') inset;' : '';
    html += `<div onclick="setFilter('${lvl.key}')" style="flex:1;min-width:160px;cursor:pointer;background:var(${lvl.bg});border-radius:var(--radius);padding:18px 16px;${active}">

    </div>`;
  });

  if(activeFilter){
    html += `<div style="margin-bottom:12px;"><button onclick="setFilter(null)">✕ Quitar filtro (mostrando solo "${STATUS_LABEL[activeFilter]}")</button></div>`;
  }

  // lista plana de obligaciones, ordenada por severidad, sin agrupar por dependencia
  const severityRank = {critico:0, urgente:1, medio:2, bajo:3, ok:4};
  let list = obligations.slice().sort((a,b)=> severityRank[a.status]-severityRank[b.status]);
  if(activeFilter) list = list.filter(o=>o.status===activeFilter);

  html += `<div class="folder"><div class="folder-body" style="padding-top:16px;">`;
  if(list.length===0){
    html += `<div class="empty-note">No hay obligaciones con este filtro.</div>`;

      <th style="width:14%">Dependencia</th>
      <th style="width:36%">Concepto</th>
      <th style="width:10%">Próxima fecha</th>
      <th style="width:18%">Responsable</th>
      <th style="width:22%">Estatus</th>
    </tr></thead><tbody>`;
    list.forEach(o=>{
      const entName = ENTITY_DEFS.find(e=>e.id===o.entity)?.name || o.entity;
      html += `<tr>
        <td data-label="Dependencia">${escapeHtml(entName)}</td>
        <td data-label="Concepto">${escapeHtml(o.title)}</td>
        <td data-label="Próxima fecha">${fmtDate(o.dueDate)}</td>
        <td data-label="Responsable">${escapeHtml(o.responsible)||'—'}</td>
        <td data-label="Estatus">${isAdmin ? `<span class="pill ${o.status}" onclick="cycleStatus('${o.id}')">${STATUS_LABEL[o.status]}</span>` : `<span class="pill ${o.status}" style="cursor:default;">${STATUS_LABEL[o.status]}</span>`}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;

  return html;
}

    <table><thead><tr>
      <th style="width:26%">Dependencia</th>
      <th style="width:18%">Categoría</th>
      <th style="width:18%">% cumplimiento</th>
      <th style="width:18%">Obligaciones</th>
      <th style="width:20%">Críticas</th>
    </tr></thead><tbody>`;
  ENTITY_DEFS.forEach(ent=>{
    const list = obligations.filter(o=>o.entity===ent.id);
    const eh = entityHealth(ent.id);
    const criticas = list.filter(o=>o.status==='critico').length;
    html += `<tr>
      <td data-label="Dependencia">${escapeHtml(ent.name)}</td>
      <td data-label="Categoría">${CATEGORY_LABEL[ent.category]||'—'}</td>
      <td data-label="% cumplimiento">${eh.pct===null?'—':eh.pct+'%'}</td>
      <td data-label="Obligaciones">${list.length}</td>
      <td data-label="Críticas">${criticas}</td>
    </tr>`;
  });
  html += `</tbody></table>
    <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);">
      <button class="primary" onclick="exportExcel()">⬇ Exportar a Excel (.xlsx)</button>
      <button onclick="exportCSV()" style="margin-left:8px;">Exportar a CSV</button>
    </div>
  </div></div>`;

  return html;
}

let statusChartInstance = null;
let entityChartInstance = null;

function initReportsCharts(){
  if(typeof Chart === 'undefined') return;
  const c = counts();
  const statusCtx = document.getElementById('chartStatus');
  if(statusChartInstance) statusChartInstance.destroy();
  if(statusCtx){
    statusChartInstance = new Chart(statusCtx, {
      type: 'doughnut',
      data: {
        labels: ['Crítico','Urgente','Medio','Bajo','Al corriente'],
        datasets: [{
          data: [c.critico, c.urgente, c.medio, c.bajo, c.ok],
          backgroundColor: ['#b23b35','#c2571f','#d98a2b','#c9a227','#2f7a55'],
          borderWidth: 0
        }]
      },
      options: {
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'Public Sans' } } } }
      }
    });
  }

  const entitiesWithData = ENTITY_DEFS.map(ent => ({ ent, eh: entityHealth(ent.id) })).filter(x => x.eh.pct !== null);
  const entityCtx = document.getElementById('chartEntities');
  if(entityChartInstance) entityChartInstance.destroy();
  if(entityCtx){
    entityChartInstance = new Chart(entityCtx, {
      type: 'bar',
      data: {
        labels: entitiesWithData.map(x => x.ent.name),
        datasets: [{
          data: entitiesWithData.map(x => x.eh.pct),
          backgroundColor: entitiesWithData.map(x => x.eh.pct < 70 ? '#b23b35' : (x.eh.pct < 90 ? '#c68a2e' : '#2f7a55')),
          borderRadius: 4
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { min:0, max:100, ticks: { callback: v => v+'%' } } }
      }
    });
  }
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){ alert('No se pudo cargar la librería de Excel. Revisa tu conexión e intenta de nuevo.'); return; }
  const health = overallHealth();
  const c = counts();

  const summaryData = [
    ['Expediente de Cumplimiento'],
    ['Empresa', companyName],
    ['Generado', new Date().toLocaleString('es-MX')],
    [],
    ['% cumplimiento general', health.pct + '%'],
    ['Al corriente', c.ok],
    ['Bajo', c.bajo],
    ['Medio', c.medio],
    ['Urgente', c.urgente],
    ['Crítico', c.critico],
    [],
    ['Dependencia','Categoría','% cumplimiento','Obligaciones','Críticas'],
  ];
  ENTITY_DEFS.forEach(ent=>{
    const list = obligations.filter(o=>o.entity===ent.id);
    const eh = entityHealth(ent.id);
    const criticas = list.filter(o=>o.status==='critico').length;
    summaryData.push([ent.name, CATEGORY_LABEL[ent.category]||'', eh.pct===null?'—':eh.pct+'%', list.length, criticas]);
  });
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryData);
  wsSummary['!cols'] = [{wch:26},{wch:20},{wch:16},{wch:14},{wch:12}];

  const detailData = [['Categoría','Dependencia','Concepto','Estado','Ciudad','Edificio/Proyecto','Periodicidad','Próxima fecha','Última verificación','Responsable','Estatus','Evidencia (PDF)','Notas']];
  obligations.forEach(o=>{
    const ent = ENTITY_DEFS.find(e=>e.id===o.entity);
    const entName = ent?.name || o.entity;
    const catLabel = CATEGORY_LABEL[ent?.category] || '';
    detailData.push([catLabel,entName,o.title,o.state||'',o.city||'',o.building||'',o.periodicity,o.dueDate||'',o.lastChecked||'',o.responsible||'',STATUS_LABEL[o.status],o.documentUrl?'Sí (ver en el dashboard)':'',o.notes||'']);
  });
  const wsDetail = XLSX.utils.aoa_to_sheet(detailData);
  wsDetail['!cols'] = [{wch:18},{wch:14},{wch:34},{wch:14},{wch:14},{wch:20},{wch:12},{wch:14},{wch:16},{wch:16},{wch:18},{wch:34},{wch:34}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Resumen');
  XLSX.utils.book_append_sheet(wb, wsDetail, 'Obligaciones');
  XLSX.writeFile(wb, 'cumplimiento_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

function renderHistoryView(){
  const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const yearsInData = [...new Set(allDocuments.map(d=>d.uploaded_at.slice(0,4)))].sort().reverse();
  const currentYear = String(new Date().getFullYear());
  if(!yearsInData.includes(currentYear)) yearsInData.unshift(currentYear);

  let filtered = allDocuments.filter(d=>{
    if(historyFilters.entity && d.entity !== historyFilters.entity) return false;
    if(historyFilters.month && d.uploaded_at.slice(5,7) !== historyFilters.month) return false;
    if(historyFilters.year && d.uploaded_at.slice(0,4) !== historyFilters.year) return false;
    if(historyFilters.search){
      const q = historyFilters.search.toLowerCase();
      const hay = (d.document_name||'').toLowerCase().includes(q) || (d.obligation_title||'').toLowerCase().includes(q);
      if(!hay) return false;
    }
    return true;
  });

  let html = `
  <div class="masthead" style="border-top-color:var(--guinda);">
    <div class="masthead-left">
      <div class="eyebrow">Archivo histórico</div>
      <h1>Historial de Documentos</h1>
      <div class="meta-row">${filtered.length} de ${allDocuments.length} documento${allDocuments.length===1?'':'s'} · agrupados por dependencia</div>
    </div>
  </div>`;

  // filtros
  html += `<div class="folder"><div class="folder-body" style="padding-top:16px;">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
      <div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">Dependencia</label>
        <select onchange="setHistoryFilter('entity', this.value)" style="border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 10px;font-family:'Public Sans',sans-serif;font-size:13px;">
          <option value="">Todas</option>
          ${ENTITY_DEFS.map(e=>`<option value="${e.id}" ${historyFilters.entity===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">Mes</label>
        <select onchange="setHistoryFilter('month', this.value)" style="border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 10px;font-family:'Public Sans',sans-serif;font-size:13px;">
          <option value="">Todos</option>
          ${MONTHS.map((m,i)=>{ const mm=String(i+1).padStart(2,'0'); return `<option value="${mm}" ${historyFilters.month===mm?'selected':''}>${m}</option>`; }).join('')}
        </select>
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">Año</label>
        <select onchange="setHistoryFilter('year', this.value)" style="border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 10px;font-family:'Public Sans',sans-serif;font-size:13px;">
          <option value="">Todos</option>
          ${yearsInData.map(y=>`<option value="${y}" ${historyFilters.year===y?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      <div style="flex:1;min-width:180px;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">Buscar</label>
        <input type="text" value="${escapeAttr(historyFilters.search)}" placeholder="Nombre de archivo o concepto…" onchange="setHistoryFilter('search', this.value)" style="border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 10px;font-family:'Public Sans',sans-serif;font-size:13px;width:100%;">
      </div>
      <button onclick="clearHistoryFilters()">Limpiar filtros</button>
    </div>
  </div></div>`;

  // agrupado por dependencia
  ENTITY_DEFS.forEach(ent=>{
    const docs = filtered.filter(d=>d.entity===ent.id);
    if(historyFilters.entity && historyFilters.entity !== ent.id) return; // si hay filtro de dependencia, solo muestra esa
    const open = historyOpenEntities.has(ent.id);
    html += `<div class="folder">
      <div class="folder-tab" onclick="toggleHistoryEntity('${ent.id}')">
        <div class="folder-tab-left">
          <span class="caret ${open?'open':''}">▸</span>
          <div class="stamp st-gray">${docs.length}</div>
          <div>
            <div class="folder-name">${escapeHtml(ent.name)}</div>
            <div class="folder-sub">${docs.length} documento${docs.length===1?'':'s'} en el historial</div>
          </div>
        </div>
      </div>`;
    if(open){
      html += `<div class="folder-body">`;
      if(docs.length===0){
        html += `<div class="empty-note">Sin documentos en el historial para esta dependencia (con los filtros actuales).</div>`;
      } else {
        html += `<table><thead><tr>
          <th style="width:15%">Subido</th>
          <th style="width:38%">Concepto</th>
          <th style="width:37%">Archivo</th>
          <th style="width:10%"></th>
        </tr></thead><tbody>`;
        docs.forEach(d=>{
          const dt = new Date(d.uploaded_at);
          html += `<tr>
            <td data-label="Subido">${dt.toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}</td>
            <td data-label="Concepto">${escapeHtml(d.obligation_title||'—')}</td>
            <td data-label="Archivo"><a href="#" onclick="viewDocument('${escapeAttr(d.document_url)}'); return false;" style="color:var(--guinda);text-decoration:underline;word-break:break-all;cursor:pointer;">📄 ${escapeHtml(d.document_name)}</a></td>
            <td class="row-actions">${isAdmin ? `<button class="icon-btn" title="Eliminar del historial" onclick="deleteHistoryDocument('${d.id}')">✕</button>` : ''}</td>
          </tr>`;
        });
        html += `</tbody></table>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  });

  return html;
}

  else if(currentView === 'history') mainHtml = renderHistoryView();
  else if(currentView === 'semaforo') mainHtml = renderSemaforoView();

  else mainHtml = renderCategoryView('fiscal');

  if(currentView === 'reports') initReportsCharts();

  const companyInput = document.getElementById('companyInput');
  if(companyInput){

      companyName = e.target.value || 'Mi Empresa';
      saveCompany();
      render();

function escapeHtml(s){
  return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function escapeAttr(s){
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
